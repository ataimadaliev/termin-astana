name: Termin Astana

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Тест: прислать сообщение"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: termin
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        if: github.event_name == 'workflow_dispatch' && inputs.test
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py --test
      - name: Watch
        if: github.event_name == 'schedule' || !inputs.test
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_MINUTES: "345"
        run: python check.py
      - name: Start next run
        if: (success() || failure()) && (github.event_name == 'schedule' || !inputs.test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml -R "${{ github.repository }}" -f test=false
